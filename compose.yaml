services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: claimarmor
      POSTGRES_USER: claimarmor
      POSTGRES_PASSWORD: claimarmor-demo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimarmor"]
      interval: 5s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

  claimarmor:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CLAIMARMOR_DATABASE_URL: postgresql+psycopg://claimarmor:claimarmor-demo@postgres:5432/claimarmor
      CLAIMARMOR_AUTH_SECRET: replace-this-in-real-deployment
      CLAIMARMOR_LLM_MODE: offline

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.4.0
    depends_on: [prometheus]
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"

volumes:
  postgres-data:
